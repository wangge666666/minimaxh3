[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "comfy-hub-worker"
version = "0.1.0"
description = "ComfyUI Cloud Hub 本地主动连接 Worker"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<0.29", "pydantic-settings>=2.8,<3", "websockets>=15,<17", "Pillow>=11,<13", "imageio-ffmpeg==0.6.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<0.23", "ruff>=0.11,<1"]

[project.scripts]
comfy-hub-worker = "comfy_hub_worker.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
